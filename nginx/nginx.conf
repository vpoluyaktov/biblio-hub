events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    
    # Increase buffer sizes for large requests
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        # Landing page - auth check done via JavaScript
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Health check endpoint (no auth required)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Audiobook Builder TTS - with WebSocket support
        location /abb-tts/ {
            set $upstream_abb_tts abb-tts:80;
            proxy_pass http://$upstream_abb_tts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /abb-tts;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Timeouts for long-running operations
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        # Audiobook Builder IA - Internet Archive audiobook builder
        location /abb-ia/ {
            set $upstream_abb_ia abb-ia:80;
            proxy_pass http://$upstream_abb_ia;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /abb-ia;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Timeouts for long-running operations (downloads and processing)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        # Biblio Catalog (E-book library with OPDS support)
        location /catalog/ {
            set $upstream_catalog biblio-catalog:80;
            proxy_pass http://$upstream_catalog;
            proxy_set_header Host $host:9900;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /catalog;
            proxy_set_header X-Forwarded-Host $host:9900;
            proxy_set_header X-Forwarded-Port 9900;
            
            # Cookie handling for Biblio Auth integration
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_path / /;
            
            # Larger buffers for JWT session cookies
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # Timeouts for large file downloads
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # TTS Silero (internal use)
        location /tts-silero/ {
            set $upstream_silero tts-silero:80;
            proxy_pass http://$upstream_silero;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tts-silero;
            
            # Timeouts for TTS generation
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 60s;
        }

        # TTS OpenVoice (internal use)
        location /tts-openvoice/ {
            set $upstream_openvoice tts-openvoice:80;
            proxy_pass http://$upstream_openvoice;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tts-openvoice;
            
            # Timeouts for TTS generation
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 60s;
        }

        # TTS Piper (internal use)
        location /tts-piper/ {
            set $upstream_piper tts-piper:80;
            proxy_pass http://$upstream_piper;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tts-piper;
            
            # Timeouts for TTS generation
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 60s;
        }

        # Stress Silero - Russian text stress marking (internal use by ABB-TTS)
        location /stress-silero/ {
            set $upstream_stress stress-silero:80;
            proxy_pass http://$upstream_stress;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /stress-silero;
            
            # Timeouts for stress processing
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Biblio Auth - Authentication and User Management
        location /auth/ {
            set $upstream_auth biblio-auth:80;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $host:9900;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:9900;
            proxy_set_header X-Forwarded-Port 9900;
            
            # Cookie handling
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_path / /;
            
            # Timeouts
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # AudiobookShelf - Self-hosted audiobook and podcast server (Third-party)
        location /audiobookshelf/ {
            set $upstream_audiobookshelf audiobookshelf:80;
            proxy_pass http://$upstream_audiobookshelf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for real-time updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Timeouts for streaming and large file uploads
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            
            # Large file upload support
            client_max_body_size 500M;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
