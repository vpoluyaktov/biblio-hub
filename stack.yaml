version: "3.8"

services:
  # =============================================================================
  # NGINX Gateway - Landing page and reverse proxy (Port 9900)
  # =============================================================================
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "9900:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - bibliohub-frontend
      - bibliohub-backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # =============================================================================
  # Biblio Audiobook Builder TTS (ABB_TTS) - E-book to audiobook converter (Port 9901)
  # =============================================================================
  abb-tts:
    image: biblio-audiobook-builder-tts:latest
    environment:
      - ABB_DATABASE_PATH=/data/audiobook-builder.db
      - ABB_SERVER_HOST=0.0.0.0
      - ABB_SERVER_PORT=9901
      - ABB_TTS_SERVER_URL=http://tts-silero:9902
      - ABB_OPDS_SERVER_URL=http://opds-server:9903
      - TZ=UTC
    volumes:
      - abb-tts-data:/data
      - abb-tts-output:/output
    networks:
      - bibliohub-backend
    depends_on:
      - tts-silero
      - opds-server
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9901/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # =============================================================================
  # Biblio TTS Server Silero (TTS_SILERO) - Text-to-Speech engine (Port 9902)
  # =============================================================================
  tts-silero:
    image: biblio-tts-server-silero:latest
    environment:
      - SILERO_HOST=0.0.0.0
      - SILERO_PORT=9902
      - SILERO_DEVICE=cpu
      - SILERO_CACHE_DIR=/data/silero
      - SILERO_SERVED_MODELS=${SILERO_MODELS:-v3_en,v5_ru,v5_1_ru}
      - SILERO_LOG_LEVEL=INFO
    volumes:
      - tts-silero-models:/data/silero
    networks:
      - bibliohub-backend
      - bibliohub-frontend
    deploy:
      replicas: ${TTS_SILERO_REPLICAS:-3}
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9902/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # =============================================================================
  # Biblio OPDS Server - E-book library catalog (Port 9903)
  # =============================================================================
  opds-server:
    image: biblio-opds-server:latest
    environment:
      - OPDS_DATABASE_PATH=/data/opds.db
      - OPDS_SERVER_HOST=0.0.0.0
      - OPDS_SERVER_PORT=9903
      - TZ=UTC
    volumes:
      - opds-server-data:/data
      - opds-server-books:/books:ro
    networks:
      - bibliohub-backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9903/api/setup/check"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

# =============================================================================
# Networks
# =============================================================================
networks:
  bibliohub-frontend:
    driver: overlay
    attachable: true
  bibliohub-backend:
    driver: overlay

# =============================================================================
# Volumes
# =============================================================================
volumes:
  abb-tts-data:
    driver: local
  abb-tts-output:
    driver: local
  tts-silero-models:
    driver: local
  opds-server-data:
    driver: local
  opds-server-books:
    driver: local
