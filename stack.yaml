version: "3.8"

services:
  # =============================================================================
  # NGINX Gateway - Landing page and reverse proxy (Port 9900)
  # =============================================================================
  nginx-gateway:
    image: vpoluyaktov/bibliohub-gateway:dev-latest
    ports:
      - "9900:80"
    networks:
      - bibliohub-frontend
      - bibliohub-backend
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # =============================================================================
  # Biblio Audiobook Builder TTS (ABB_TTS) - E-book to audiobook converter
  # Accessible via: http://host:9900/abb-tts/
  # =============================================================================
  abb-tts:
    image: vpoluyaktov/bibliohub-audiobook-builder-tts:dev-latest
    environment:
      - ABB_TTS_HOST=0.0.0.0
      - ABB_TTS_PORT=80
      - ABB_TTS_BASE_PATH=/abb-tts
      - ABB_TTS_SERVER_URL=http://tts-silero:80/tts-silero
      - ABB_TTS_OPDS_SERVER_URL=http://biblio-catalog:80/catalog
      - ABB_TTS_TEMP_DIR=/data
      - ABB_TTS_LOG_FILE=/logs/abb_tts.log
      - ABB_TTS_LOG_LEVEL=${ABB_TTS_LOG_LEVEL:-INFO}
      - ABB_TTS_AUTH_MODE=biblio-auth
      - ABB_TTS_BIBLIO_AUTH_URL=http://biblio-auth:80/auth
      - TZ=UTC
    volumes:
      - ./data/abb_tts/db:/db
      - ./data/abb_tts/temp:/data
      - ./data/abb_tts/logs:/logs
    networks:
      - bibliohub-backend
      - bibliohub-frontend
    depends_on:
      - tts-silero
      - biblio-catalog
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/abb-tts/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # =============================================================================
  # Biblio TTS Server Silero (TTS_SILERO) - Text-to-Speech engine
  # Accessible via: http://host:9900/tts-silero/ (internal use)
  # =============================================================================
  tts-silero:
    image: vpoluyaktov/bibliohub-tts-server-silero:dev-latest
    environment:
      - SILERO_HOST=0.0.0.0
      - SILERO_PORT=80
      - SILERO_BASE_PATH=/tts-silero
      - SILERO_DEVICE=cpu
      - SILERO_CACHE_DIR=/data/silero
      - SILERO_SERVED_MODELS=${SILERO_MODELS:-v3_en,v5_ru,v5_1_ru}
      - SILERO_LOG_LEVEL=INFO
    volumes:
      - ./data/tts_silero/models:/data/silero
    networks:
      - bibliohub-backend
    deploy:
      replicas: ${TTS_SILERO_REPLICAS:-3}
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  # =============================================================================
  # Biblio TTS Server OpenVoice (TTS_OPENVOICE) - MeloTTS engine
  # Accessible via: http://host:9900/tts-openvoice/ (internal use)
  # =============================================================================
  tts-openvoice:
    image: vpoluyaktov/bibliohub-tts-server-openvoice:dev-latest
    environment:
      - OPENVOICE_HOST=0.0.0.0
      - OPENVOICE_PORT=80
      - OPENVOICE_BASE_PATH=/tts-openvoice
      - OPENVOICE_DEVICE=cpu
      - OPENVOICE_CACHE_DIR=/data/openvoice
      - OPENVOICE_SERVED_LANGUAGES=${OPENVOICE_LANGUAGES:-EN,ES}
      - OPENVOICE_LOG_LEVEL=INFO
    volumes:
      - ./data/tts_openvoice/models:/data/openvoice
    networks:
      - bibliohub-backend
    deploy:
      replicas: ${TTS_OPENVOICE_REPLICAS:-1}
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  # =============================================================================
  # Biblio Catalog - E-book library catalog with OPDS support
  # Accessible via: http://host:9900/catalog/
  # =============================================================================
  biblio-catalog:
    image: vpoluyaktov/bibliohub-catalog:dev-latest
    environment:
      - OPDS_SERVER_HOST=0.0.0.0
      - OPDS_SERVER_PORT=80
      - OPDS_BASE_PATH=/catalog
      - TZ=UTC
      # Use biblio-auth mode for BiblioHub stack integration
      - AUTH_MODE=biblio-auth
      - BIBLIO_AUTH_URL=http://biblio-auth:80/auth
      - OIDC_REDIRECT_URL=http://${BIBLIO_HUB_HOSTNAME:-localhost}:${BIBLIO_HUB_PORT:-9900}/catalog/api/auth/oidc/callback
    volumes:
      - ./data/opds/db:/db
      - ${EBOOKS_PATH}:/books:ro
    networks:
      - bibliohub-backend
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/catalog/api/setup/check"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # =============================================================================
  # Biblio Auth - Authentication and User Management
  # Accessible via: http://host:9900/auth/
  # Admin Console: http://host:9900/auth/admin
  # =============================================================================
  biblio-auth:
    image: vpoluyaktov/bibliohub-auth:dev-latest
    environment:
      - BIBLIO_AUTH_DB_PATH=/db/auth.db
      - BIBLIO_AUTH_SECRET_KEY=${BIBLIO_AUTH_SECRET_KEY}
      - BIBLIO_AUTH_TOKEN_EXPIRY=${BIBLIO_AUTH_TOKEN_EXPIRY:-86400}
      - BIBLIO_AUTH_ADMIN_PASSWORD=${BIBLIO_AUTH_ADMIN_PASSWORD:-admin}
      - BIBLIO_AUTH_USER_PASSWORD=${BIBLIO_AUTH_USER_PASSWORD:-user}
      - BIBLIO_AUTH_SECURE_COOKIES=${BIBLIO_AUTH_SECURE_COOKIES:-true}
      - BIBLIO_AUTH_BASE_PATH=/auth
      - BIBLIO_AUTH_HOST=0.0.0.0
      - BIBLIO_AUTH_PORT=80
      - BIBLIO_AUTH_RATE_LIMIT_REQUESTS=${BIBLIO_AUTH_RATE_LIMIT_REQUESTS:-5}
      - BIBLIO_AUTH_RATE_LIMIT_WINDOW=${BIBLIO_AUTH_RATE_LIMIT_WINDOW:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data/biblio_auth/db:/db
    networks:
      - bibliohub-backend
      - bibliohub-frontend
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/auth/api/validate"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

# =============================================================================
# Networks
# =============================================================================
networks:
  bibliohub-frontend:
    driver: overlay
    attachable: true
  bibliohub-backend:
    driver: overlay

# =============================================================================
# Note: Using bind mounts to ./data directory
# Run ./scripts/start_stack.sh to create required directories
# =============================================================================
