version: "3.8"

services:
  # =============================================================================
  # NGINX Gateway - Landing page and reverse proxy (Port 9900)
  # =============================================================================
  nginx-gateway:
    image: vpoluyaktov/bibliohub-gateway:dev-latest
    ports:
      - "9900:80"
    networks:
      - bibliohub-frontend
      - bibliohub-backend
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # =============================================================================
  # Biblio Audiobook Builder TTS (ABB_TTS) - E-book to audiobook converter
  # Accessible via: http://host:9900/abb-tts/
  # =============================================================================
  abb-tts:
    image: vpoluyaktov/bibliohub-audiobook-builder-tts:dev-latest
    environment:
      - ABB_TTS_HOST=0.0.0.0
      - ABB_TTS_PORT=80
      - ABB_TTS_BASE_PATH=/abb-tts
      - ABB_TTS_SERVER_URL=http://tts-silero:80
      - ABB_TTS_OPDS_SERVER_URL=http://opds-server:80
      - ABB_TTS_TEMP_DIR=/data
      - ABB_TTS_LOG_FILE=/logs/abb_tts.log
      - TZ=UTC
    volumes:
      - ./data/abb_tts/db:/db
      - ./data/abb_tts/temp:/data
      - ./data/abb_tts/logs:/logs
    networks:
      - bibliohub-backend
    depends_on:
      - tts-silero
      - opds-server
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # =============================================================================
  # Biblio TTS Server Silero (TTS_SILERO) - Text-to-Speech engine
  # Accessible via: http://host:9900/tts-silero/ (internal use)
  # =============================================================================
  tts-silero:
    image: vpoluyaktov/bibliohub-tts-server-silero:dev-latest
    environment:
      - SILERO_HOST=0.0.0.0
      - SILERO_PORT=80
      - SILERO_BASE_PATH=/tts-silero
      - SILERO_DEVICE=cpu
      - SILERO_CACHE_DIR=/data/silero
      - SILERO_SERVED_MODELS=${SILERO_MODELS:-v3_en,v5_ru,v5_1_ru}
      - SILERO_LOG_LEVEL=INFO
    volumes:
      - ./data/tts_silero/models:/data/silero
    networks:
      - bibliohub-backend
    deploy:
      replicas: ${TTS_SILERO_REPLICAS:-3}
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  # =============================================================================
  # Biblio TTS Server OpenVoice (TTS_OPENVOICE) - MeloTTS engine
  # Accessible via: http://host:9900/tts-openvoice/ (internal use)
  # =============================================================================
  tts-openvoice:
    image: vpoluyaktov/bibliohub-tts-server-openvoice:dev-latest
    environment:
      - OPENVOICE_HOST=0.0.0.0
      - OPENVOICE_PORT=80
      - OPENVOICE_BASE_PATH=/tts-openvoice
      - OPENVOICE_DEVICE=cpu
      - OPENVOICE_CACHE_DIR=/data/openvoice
      - OPENVOICE_SERVED_LANGUAGES=${OPENVOICE_LANGUAGES:-EN,ES}
      - OPENVOICE_LOG_LEVEL=INFO
    volumes:
      - ./data/tts_openvoice/models:/data/openvoice
    networks:
      - bibliohub-backend
    deploy:
      replicas: ${TTS_OPENVOICE_REPLICAS:-1}
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  # =============================================================================
  # Biblio OPDS Server - E-book library catalog
  # Accessible via: http://host:9900/opds/
  # =============================================================================
  opds-server:
    image: vpoluyaktov/bibliohub-opds-server:dev-latest
    environment:
      - OPDS_SERVER_HOST=0.0.0.0
      - OPDS_SERVER_PORT=80
      - OPDS_BASE_PATH=/opds
      - TZ=UTC
    volumes:
      - ./data/opds/db:/db
      - ${EBOOKS_PATH}:/books:ro
    networks:
      - bibliohub-backend
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/opds/api/setup/check"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

# =============================================================================
# Networks
# =============================================================================
networks:
  bibliohub-frontend:
    driver: overlay
    attachable: true
  bibliohub-backend:
    driver: overlay

# =============================================================================
# Note: Using bind mounts to ./data directory
# Run ./scripts/start_stack.sh to create required directories
# =============================================================================
