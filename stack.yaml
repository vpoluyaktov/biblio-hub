version: "3.8"

services:
  # =============================================================================
  # NGINX Gateway - Landing page and reverse proxy
  # =============================================================================
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - biblio-frontend
      - biblio-backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # =============================================================================
  # Biblio OPDS Server - E-book library catalog
  # =============================================================================
  biblio-opds-server:
    image: biblio-opds-server:latest
    environment:
      - OPDS_DATABASE_PATH=/data/opds.db
      - OPDS_SERVER_HOST=0.0.0.0
      - OPDS_SERVER_PORT=9988
      - TZ=UTC
    volumes:
      - opds-data:/data
      - ${BOOKS_LIBRARY_PATH:-/data/books}:/books:ro
    networks:
      - biblio-backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9988/api/setup/check"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # =============================================================================
  # Biblio Audiobook Builder TTS - E-book to audiobook converter
  # =============================================================================
  biblio-audiobook-builder-tts:
    image: biblio-audiobook-builder-tts:latest
    environment:
      - ABB_DATABASE_PATH=/data/audiobook-builder.db
      - ABB_SERVER_HOST=0.0.0.0
      - ABB_SERVER_PORT=8080
      - ABB_TTS_SERVER_URL=http://biblio-tts-server-silero:5555
      - ABB_OPDS_SERVER_URL=http://biblio-opds-server:9988
      - TZ=UTC
    volumes:
      - audiobook-data:/data
      - audiobook-output:/output
    networks:
      - biblio-backend
    depends_on:
      - biblio-tts-server-silero
      - biblio-opds-server
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # =============================================================================
  # Biblio TTS Server (Silero) - Text-to-Speech engine
  # =============================================================================
  biblio-tts-server-silero:
    image: biblio-tts-server-silero:latest
    environment:
      - SILERO_HOST=0.0.0.0
      - SILERO_PORT=5555
      - SILERO_DEVICE=cpu
      - SILERO_CACHE_DIR=/data/silero
      - SILERO_SERVED_MODELS=${SILERO_MODELS:-v3_en,v5_ru,v5_1_ru}
      - SILERO_LOG_LEVEL=INFO
    volumes:
      - tts-models:/data/silero
    networks:
      - biblio-backend
    deploy:
      replicas: ${TTS_REPLICAS:-3}
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5555/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

# =============================================================================
# Networks
# =============================================================================
networks:
  biblio-frontend:
    driver: overlay
  biblio-backend:
    driver: overlay
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  opds-data:
    driver: local
  audiobook-data:
    driver: local
  audiobook-output:
    driver: local
  tts-models:
    driver: local
